[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coordination-loop-harness"
version = "0.1.0"
description = "A repository template for durable, human-supervised ChatGPT Web and Codex CLI development loops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jerry Wang" }]
dependencies = ["jsonschema>=4.23,<5"]
keywords = ["codex", "chatgpt", "coordination", "human-in-the-loop", "repository-template", "agent-harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
clh = "coordination_loop_harness.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
