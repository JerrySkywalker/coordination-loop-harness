name: Bug report
description: Report a reproducible harness defect
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use synthetic repository names and redact local paths or credentials.
    validations:
      required: true
