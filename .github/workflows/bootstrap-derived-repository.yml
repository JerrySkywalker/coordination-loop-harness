name: Bootstrap derived coordination repository

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Human-readable project name
        required: true
        type: string
      project_slug:
        description: Stable project slug
        required: true
        type: string
      template_repository:
        description: Template repository in owner/name form
        required: true
        type: string
      template_exact_sha:
        description: Exact 40-character template commit SHA
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install template tooling
        run: python -m pip install .
      - name: Create bootstrap branch
        env:
          BRANCH: bootstrap/${{ github.run_id }}
        run: git switch -c "$BRANCH"
      - name: Bootstrap current repository
        run: >-
          clh bootstrap-repository
          --template-root .
          --target-root .
          --project-name "${{ inputs.project_name }}"
          --project-slug "${{ inputs.project_slug }}"
          --template-repository "${{ inputs.template_repository }}"
          --template-version "$(cat TEMPLATE_VERSION)"
          --template-sha "${{ inputs.template_exact_sha }}"
          --safe-mode preserve-active
      - name: Validate generated repository
        run: clh validate --root .
      - name: Commit bootstrap
        id: changes
        env:
          BRANCH: bootstrap/${{ github.run_id }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README.zh-CN.md AGENTS.md coord-project.json \
            .coord-template-lock.json .coord-template.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: bootstrap derived coordination repository"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push bootstrap branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: bootstrap/${{ github.run_id }}
        run: git push origin "$BRANCH"
      - name: Open Draft pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bootstrap/${{ github.run_id }}
        run: >-
          gh pr create
          --draft
          --base "${{ github.event.repository.default_branch }}"
          --head "$BRANCH"
          --title "Bootstrap ${{ inputs.project_name }}"
          --body "Generated by the repository-scoped bootstrap workflow."
