name: Bootstrap derived coordination repository

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Human-readable project name
        required: true
        type: string
      project_slug:
        description: Stable project slug
        required: true
        type: string
      template_repository:
        description: Template repository in owner/name form
        required: true
        type: string
      template_exact_sha:
        description: Exact 40-character template commit SHA
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install template tooling
        run: python -m pip install .
      - name: Verify checkout and template provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          EVENT_TEMPLATE_REPOSITORY: ${{ github.event.repository.template_repository.full_name }}
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_SLUG: ${{ inputs.project_slug }}
          TEMPLATE_REPOSITORY: ${{ inputs.template_repository }}
          TEMPLATE_EXACT_SHA: ${{ inputs.template_exact_sha }}
        run: |
          if [ -z "$PROJECT_NAME" ] ||
             [[ ! "$PROJECT_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] ||
             [[ ! "$TEMPLATE_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*/[A-Za-z0-9_.-]+$ ]] ||
             [[ ! "$TEMPLATE_EXACT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid bootstrap dispatch input" >&2
            exit 1
          fi
          checkout_head="$(git rev-parse HEAD)"
          checkout_tree="$(git rev-parse 'HEAD^{tree}')"
          checkout_origin="$(git remote get-url origin)"
          if [ "$checkout_head" != "$GITHUB_SHA" ]; then
            echo "Checked-out HEAD does not match GITHUB_SHA" >&2
            exit 1
          fi
          clh repository verify \
            --repository-root . \
            --expected-origin "$TARGET_REPOSITORY" \
            --expected-sha "$checkout_head" \
            --no-offline
          if [ -z "$EVENT_TEMPLATE_REPOSITORY" ] ||
             [ "${EVENT_TEMPLATE_REPOSITORY,,}" != "${TEMPLATE_REPOSITORY,,}" ]; then
            echo "Template repository claim does not match GitHub derivation metadata" >&2
            exit 1
          fi
          template_tree="$(
            gh api --hostname github.com \
              "repos/$TEMPLATE_REPOSITORY/git/commits/$TEMPLATE_EXACT_SHA" \
              --jq .tree.sha
          )"
          if [ "$checkout_tree" != "$template_tree" ]; then
            echo "Derived checkout tree does not match the claimed template commit" >&2
            exit 1
          fi
          if [ -z "$checkout_origin" ]; then
            echo "Derived checkout origin is missing" >&2
            exit 1
          fi
      - name: Create bootstrap branch
        env:
          BRANCH: bootstrap/${{ github.run_id }}
        run: git switch -c "$BRANCH"
      - name: Bootstrap current repository
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_SLUG: ${{ inputs.project_slug }}
          TEMPLATE_REPOSITORY: ${{ inputs.template_repository }}
          TEMPLATE_EXACT_SHA: ${{ inputs.template_exact_sha }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          template_version="$(cat TEMPLATE_VERSION)"
          clh bootstrap-repository \
            --template-root . \
            --target-root . \
            --project-name "$PROJECT_NAME" \
            --project-slug "$PROJECT_SLUG" \
            --template-repository "$TEMPLATE_REPOSITORY" \
            --template-version "$template_version" \
            --template-sha "$TEMPLATE_EXACT_SHA" \
            --target-repository "$TARGET_REPOSITORY" \
            --safe-mode preserve-active
      - name: Validate generated repository
        run: clh validate --root .
      - name: Commit bootstrap
        id: changes
        env:
          BRANCH: bootstrap/${{ github.run_id }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README.zh-CN.md AGENTS.md coord-project.json \
            .coord-template-lock.json .coord-template.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: bootstrap derived coordination repository"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push bootstrap branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: bootstrap/${{ github.run_id }}
        run: git push origin "$BRANCH"
      - name: Open Draft pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bootstrap/${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: >-
          gh pr create
          --draft
          --base "$DEFAULT_BRANCH"
          --head "$BRANCH"
          --title "Bootstrap $PROJECT_NAME"
          --body "Generated by the repository-scoped bootstrap workflow."
